# This rule is not used by the project acm-cert-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over certificates.ioof.com.au.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: acm-cert-operator
    app.kubernetes.io/managed-by: kustomize
  name: acmcertificate-admin-role
rules:
- apiGroups:
  - certificates.ioof.com.au
  resources:
  - acmcertificates
  verbs:
  - '*'
- apiGroups:
  - certificates.ioof.com.au
  resources:
  - acmcertificates/status
  verbs:
  - get
