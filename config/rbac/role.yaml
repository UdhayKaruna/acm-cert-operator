---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - certificates.ioof.com.au
  resources:
  - acmcertificates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - certificates.ioof.com.au
  resources:
  - acmcertificates/finalizers
  verbs:
  - update
- apiGroups:
  - certificates.ioof.com.au
  resources:
  - acmcertificates/status
  verbs:
  - get
  - patch
  - update
